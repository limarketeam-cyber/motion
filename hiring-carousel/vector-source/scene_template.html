  <text fill="#ffffff" font-family="Ubuntu" font-weight="700" font-size="132.825" x="366.337" y="312.226">r</text>
  <text fill="#ffffff" font-family="Ubuntu" font-weight="700" font-size="132.825" x="415.944" y="312.63">e</text></g></g>

  <g clip-path="url(#cP1)"><text fill="#5a67ef" font-family="Vazirmatn" font-weight="900" font-size="47.697" x="328.057" y="317.889" direction="rtl" text-anchor="start">هم بانـــد</text></g>

<g clip-path="url(#cLogo)"><g id="logo">
  <path fill="#2f3690" d="M372.2 734.0 H379.8 A12.03 12.03 0 0 1 379.8 758.06 H372.2 A4.2 4.2 0 0 1 368.0 753.86 V738.2 A4.2 4.2 0 0 1 372.2 734.0 Z"/>

<g clip-path="url(#cWeb)"><g id="web"><text fill="#2f3690" font-family="Ubuntu" font-weight="700" font-size="20.4" letter-spacing="-0.55" x="551.1" y="753.9">Dariahamrah.ir</text></g></g>
</svg>
<script>
const BEAM = %%BEAM%%;
const XH = 444.66, XR = 483.53, W = XR - XH, DB = 523.7, ACY = 478.4, AR = 19.435, PIV = DB - 7.4;
const $ = id => document.getElementById(id);
const clamp = t => Math.min(Math.max(t, 0), 1);
const prog = (t, a, b) => clamp((t - a) / (b - a));
const out3 = x => 1 - Math.pow(1 - x, 3);
const inout3 = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = (x, s = 1.6) => { x -= 1; return 1 + (s + 1) * x * x * x + s * x * x; };
// closed door outline sampled finely (for the perspective squash)
const doorPts = (() => {
  const p = [[XH, DB], [XH, ACY]];
  for (let i = 1; i < 64; i++) { const a = Math.PI - Math.PI * i / 64; p.push([XH + AR + AR * Math.cos(a), ACY - AR * Math.sin(a)]); }
  p.push([XR, ACY], [XR, DB]); return p;
})();
// box draw lengths
const L1 = $('box1').getTotalLength(), L2 = $('box2').getTotalLength();
$('box1').style.strokeDasharray = L1; $('box2').style.strokeDasharray = L2;
const D_LEFT = 338.1;
function setT(t) {
  // frame draws itself from the bottom-left corner
  const pb = out3(prog(t, 0, 1.67));
  $('box1').style.strokeDashoffset = L1 * (1 - pb); $('box2').style.strokeDashoffset = L2 * (1 - pb);
  $('box').style.visibility = pb > 0 ? 'visible' : 'hidden';
  // D pops in
  const pd = prog(t, 0, 0.93), s = pd < 1 ? back(pd, 1.2) : 1;
  $('D').setAttribute('transform', `translate(513.7 348) scale(${Math.max(s, 0.0001)}) translate(-513.7 -348)`);
  $('D').style.visibility = pd > 0 ? 'visible' : 'hidden';
  // yellow words slide out from behind the D
  const slide = (id, a, b, left) => { const p = prog(t, a, b); const g = $(id);
    g.style.visibility = p > 0 ? 'visible' : 'hidden';
    g.setAttribute('transform', `translate(${(D_LEFT - left + 2) * (1 - out3(p))} 0)`); };
  slide('we', 0.65, 1.76, 120.5); slide('hi', 0.74, 1.85, 205.0);
  // white words rise inside the D
  const rise = (id, a, b, h) => { const p = prog(t, a, b); const g = $(id);
    g.style.visibility = p > 0 ? 'visible' : 'hidden';
    g.setAttribute('transform', `translate(0 ${h * (1 - out3(p))})`); };
  rise('re', 0.74, 1.76, 130); rise('ring', 0.83, 1.85, 140);
  // Persian lines are written right to left
  const wipe = (id, a, b, x0, x1) => { const p = inout3(prog(t, a, b)); const r = $(id);
    const e = x1 - p * (x1 - x0); r.setAttribute('x', e); r.setAttribute('width', Math.max(x1 - e, 0)); };
  wipe('p1r', 0.65, 1.76, 130, 345); wipe('p2r', 0.83, 1.94, 130, 345);
  // person pops up from the feet
  const pp = prog(t, 0.56, 1.39), ps = pp < 1 ? back(pp, 2.0) : 1;
  $('person').setAttribute('transform', `translate(332.4 582.6) scale(${Math.max(ps, 0.0001)}) translate(-332.4 -582.6)`);
  $('person').style.visibility = pp > 0 ? 'visible' : 'hidden';
  // title lines grow outward, texts rise
  const pl = out3(prog(t, 0.56, 1.57));
  $('llr').setAttribute('x', 207.88 - 62.89 * pl - 0.5); $('llr').setAttribute('width', 62.89 * pl + 1);
  $('rlr').setAttribute('width', 61.64 * pl + 0.5); $('rlr').setAttribute('x', 602.92 - 0.5 * (pl > 0));
  $('ll').style.visibility = $('rl').style.visibility = pl > 0 ? 'visible' : 'hidden';
  rise('title', 0.56, 1.57, 36); rise('phone', 0.65, 1.67, 26); rise('logo', 0.74, 1.76, 30); rise('web', 0.83, 1.85, 26);
  // door: panel rises in, then opens 2s -> 3s (hinge on the left, swinging into the lit room)
  const pr = prog(t, 0.93, 1.33);
  $('door').setAttribute('visibility', pr > 0 ? 'visible' : 'hidden');
  const ytop = DB - out3(pr) * (DB - 455);
  $('doorRiseRect').setAttribute('y', ytop); $('doorRiseRect').setAttribute('height', DB - ytop + 2);
  const th = inout3(prog(t, 2.0, 3.0)) * Math.PI / 2, c = Math.cos(th), sn = Math.sin(th);
  $('doorLight').setAttribute('visibility', th > 0 ? 'visible' : 'hidden');
  const pts = doorPts.map(([x, y]) => { const u = (x - XH) / W; const sc = 1 - 0.11 * sn * u;
    return [XH + u * W * c, PIV + (y - PIV) * sc]; });
  $('doorPanel').setAttribute('d', c > 0.002 ? 'M' + pts.map(p => p[0].toFixed(3) + ' ' + p[1].toFixed(3)).join(' L') + ' Z' : '');
  const shade = 1 - 0.25 * sn;
  $('doorPanel').setAttribute('fill', `rgb(${27 * shade},${32 * shade},${94 * shade})`);
  const ku = 0.8, ksc = 1 - 0.11 * sn * ku;
  $('knob').setAttribute('cx', XH + ku * W * c); $('knob').setAttribute('cy', PIV + (DB - 29.6 - PIV) * ksc);
  $('knob').setAttribute('rx', 1.93 * c * ksc); $('knob').setAttribute('ry', 1.93 * ksc);
  $('knob').setAttribute('visibility', c > 0.06 ? 'visible' : 'hidden');
  // floor light = projection of the open gap (instant, widens from the latch side)
  if (th > 0) {
    const lt = BEAM.LT + (BEAM.RT - BEAM.LT) * c, lb = BEAM.LB + (BEAM.RB - BEAM.LB) * c;
    $('beamLit').setAttribute('d', `M${lt} ${BEAM.top - 0.3} L${BEAM.RT} ${BEAM.top - 0.3} L${BEAM.RB} ${BEAM.bot} L${lb} ${BEAM.bot} Z`);
  } else $('beamLit').setAttribute('d', '');
}
window.setT = setT;
setT(0);
</script></body></html>
