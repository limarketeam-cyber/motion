<!-- @dsCard group="Motion" viewport="700x170" subtitle="Circle scales from 60%, square slides from left edge, bars grow from left" name="Shape entrances" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-fa);color:var(--ink);box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}@keyframes c{0%{transform:scale(.6);opacity:0}30%,85%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}@keyframes q{0%{transform:translateX(-120%)}30%,85%{transform:none;opacity:1}100%{opacity:0}}@keyframes r{0%{transform:scaleX(0)}30%,85%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.c{animation:c 2.6s var(--ease-enter) infinite}.q{animation:q 2.6s var(--ease-enter) infinite}.r{transform-origin:left;animation:r 2.6s var(--ease-enter) infinite}</style></head><body><div style="display:flex;gap:56px;align-items:center"><div style="display:flex;flex-direction:column;align-items:center;gap:10px"><div class="c" style="width:100px;height:100px;border-radius:50%;background:var(--yellow)"></div><span class="m">دیجیتال</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:10px;overflow:hidden;width:120px"><div class="q" style="width:100px;height:100px;background:var(--yellow)"></div><span class="m">برندینگ</span></div><div style="display:flex;flex-direction:column;gap:6px;width:160px" dir="ltr"><div class="r" style="height:24px;width:100%;background:var(--yellow)"></div><div class="r" style="height:24px;width:68%;background:var(--yellow);animation-delay:.08s"></div><div class="r" style="height:24px;width:36%;background:var(--yellow);animation-delay:.16s"></div><span class="m" style="text-align:center">فروش و رشد</span></div></div></body></html>
