<!-- @dsCard group="Motion" viewport="700x200" subtitle="Enter = easeOutQuart · Exit = easeInCubic · Move = easeInOutCubic" name="Easing" -->
<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-fa);color:var(--ink);box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}@keyframes go{0%,10%{left:0}60%,100%{left:calc(100% - 28px)}}.b{animation:go 2.4s infinite}.enter{animation-timing-function:var(--ease-enter)}.exit{animation-timing-function:var(--ease-exit)}.move{animation-timing-function:var(--ease-move)}</style></head><body><div style="display:flex;flex-direction:column;gap:18px"><div style="display:flex;align-items:center;gap:16px"><div style="width:130px;font-size:14px;font-weight:700">ورود</div><div dir="ltr" style="flex:1;height:36px;border-bottom:1px solid var(--line);position:relative"><div class="b enter" style="position:absolute;top:4px;left:0;width:28px;height:28px;background:var(--ink)"></div></div><div class="m" dir="ltr" style="width:150px">--ease-enter</div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:130px;font-size:14px;font-weight:700">خروج</div><div dir="ltr" style="flex:1;height:36px;border-bottom:1px solid var(--line);position:relative"><div class="b exit" style="position:absolute;top:4px;left:0;width:28px;height:28px;background:var(--ink)"></div></div><div class="m" dir="ltr" style="width:150px">--ease-exit</div></div><div style="display:flex;align-items:center;gap:16px"><div style="width:130px;font-size:14px;font-weight:700">جابه‌جایی / وایپ</div><div dir="ltr" style="flex:1;height:36px;border-bottom:1px solid var(--line);position:relative"><div class="b move" style="position:absolute;top:4px;left:0;width:28px;height:28px;background:var(--ink)"></div></div><div class="m" dir="ltr" style="width:150px">--ease-move</div></div></div></body></html>
