<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-fa);color:var(--ink);box-sizing:border-box}.m{font-family:var(--font-mono);font-size:11px;color:var(--ink-3)}@keyframes p{0%,30%{left:100%;right:0}45%{left:0;right:0}60%,100%{left:0;right:100%}}@keyframes a{0%,44%{opacity:1}45%,100%{opacity:0}}@keyframes b{0%,44%{opacity:0}45%,100%{opacity:1}}.p{animation:p 3s var(--ease-move) infinite}.a{animation:a 3s steps(1) infinite}.b{animation:b 3s steps(1) infinite}</style></head><body><div style="position:relative;height:120px;overflow:hidden;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line)"><div class="a" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;font-size:28px;font-weight:900">۱ · قلاب</div><div class="b" style="position:absolute;inset:0;display:flex;align-items:center;padding:0 24px;font-size:28px;font-weight:900">۲ · تعریف</div><div class="p" style="position:absolute;top:0;bottom:0;background:var(--lime)"></div></div></body></html>
